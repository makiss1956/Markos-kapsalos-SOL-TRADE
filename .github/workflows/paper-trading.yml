# ============================================================
# sol_trade — Paper trading στο GitHub Actions (MULTI-TOKEN)
# Τρέχει 8 parallel jobs (ένα ανά token) κάθε ώρα.
# ============================================================

name: Paper Trading (sol_trade multi-token)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'   # κάθε ώρα UTC

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        token: [SOL, WBTC, PYTH, JTO, JUP, RAY, RENDER, BONK]
    concurrency:
      group: paper-${{ matrix.token }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one paper tick for ${{ matrix.token }}
        env:
          SOL_TRADE_MODE: paper
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py trade --once --token ${{ matrix.token }}

      - name: Commit paper state for ${{ matrix.token }}
        run: |
          git config user.name "sol-trade-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ matrix.token }}" = "SOL" ]; then
            git add data/paper_state.json data/price_history.json
          else
            git add data/paper_state_${{ matrix.token }}.json \
                   data/price_history_${{ matrix.token }}.json
          fi
          if git diff --cached --quiet; then
            echo "Δεν άλλαξε τίποτα — skip commit"
          else
            git commit -m "paper state update ${{ matrix.token }} [skip ci]"
            
            # Μηχανισμός αυτόματης επανάληψης (retry loop) για ασφαλές push σε parallel jobs
            n=0
            until [ "$n" -ge 5 ]
            do
               git pull --rebase origin main && git push && break
               n=$((n+1))
               echo "Σύγκρουση στο git push, γίνεται προσπάθεια $n σε 3 δευτερόλεπτα..."
               sleep 3
            done
            
            if [ "$n" -ge 5 ]; then
               echo "Σφάλμα: Απέτυχαν όλες οι προσπάθειες push."
               exit 1
            fi
          fi
